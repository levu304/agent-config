schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Must use grill-me skill
    # - Must use adversarial-authoring skill
    # - Must use glossary skill
  design:
    - Must use c4-diagrams skill
    - Must use architecture-patterns skill
  # adr:
  #   - Must use architectural-decision-records skill
  # specs:
    # - Must use spec-as-source skill
  # tasks:
    # - Must use spec-as-source skill

operations:
  apply:
    guidance:
      - Must use test-driven-development skill
      - Must use solid skill
      - Must use code-simplification skill
  archive:
    guidance:
      - Must run OpenSpec Sync before archiving
